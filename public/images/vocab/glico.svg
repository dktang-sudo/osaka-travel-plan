<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#ECFDF5"/>
  <!-- Glico Runner Silhouette -->
  <!-- Head -->
  <circle cx="50" cy="24" r="8" fill="#059669" stroke="#1E293B" stroke-width="2"/>
  <!-- Torso & Arms Up -->
  <path d="M50 32 L 50 56 M50 38 L 26 20 M50 38 L 74 20" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <!-- Legs Running -->
  <path d="M50 56 L 30 82 M50 56 L 68 76 L 80 82" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <!-- Track outline -->
  <ellipse cx="50" cy="85" rx="38" ry="8" stroke="#10B981" stroke-width="2" fill="none"/>
  <!-- Signboard Text -->
  <rect x="25" y="8" width="50" height="10" rx="3" fill="#F59E0B" stroke="#1E293B" stroke-width="1.5"/>
  <text x="50" y="16" font-family="sans-serif" font-size="7" font-weight="900" fill="#1E293B" text-anchor="middle">GLICO / 道頓堀</text>
</svg>
